<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" width="100%" height="100%">
  <defs>
    <!-- Drop Shadows -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
    <filter id="shadow-strong" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#1E293B" flood-opacity="0.12"/>
    </filter>

    <!-- Gradients -->
    <linearGradient id="centerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>

    <linearGradient id="arcGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>

    <linearGradient id="arcGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>

    <linearGradient id="arcGrad3" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#1E40AF"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>

    <!-- Feedback Marker -->
    <marker id="feedback-arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="900" height="900" fill="#FAFAFC"/>
  <g text-anchor="middle">
    <text x="450" y="70" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" fill="#0F172A" letter-spacing="-0.5">The Discovery Development Lifecycle</text>
    <text x="450" y="100" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500" fill="#64748B">Continuous Progression &amp; Scientific Validation Loop</text>
  </g>
  <!-- Outer Arc Arrows -->
  <g filter="url(#shadow)">
    <path d="M 126.24 508.33 A 325 325 0 0 1 636.41 213.78" fill="none" stroke="url(#arcGrad1)" stroke-width="12" stroke-linecap="round"/>
    <path d="M 643.30 203.95 L 654.43 226.39 L 629.53 223.61 Z" fill="url(#arcGrad1)"/>
  </g>
  <g filter="url(#shadow)">
    <path d="M 679.81 250.19 A 325 325 0 0 1 612.50 761.46" fill="none" stroke="url(#arcGrad2)" stroke-width="12" stroke-linecap="round"/>
    <path d="M 618.50 771.85 L 593.45 772.46 L 606.50 751.07 Z" fill="url(#arcGrad2)"/>
  </g>
  <g filter="url(#shadow)">
    <path d="M 534.12 793.93 A 325 325 0 0 1 155.45 617.35" fill="none" stroke="url(#arcGrad3)" stroke-width="12" stroke-linecap="round"/>
    <path d="M 144.57 622.42 L 146.15 597.41 L 166.33 612.28 Z" fill="url(#arcGrad3)"/>
  </g>
  <!-- Central Hub -->
  <circle cx="450" cy="480" r="115" fill="url(#centerGrad)" stroke="#2563EB" stroke-width="3.5" filter="url(#shadow-strong)"/>
  <circle cx="450" cy="480" r="108" fill="none" stroke="#93C5FD" stroke-width="1.5" stroke-dasharray="4 4"/>
  <g text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
    <text x="450" y="472" font-size="22" font-weight="800" fill="#0F172A">Discovery</text>
    <text x="450" y="500" font-size="22" font-weight="800" fill="#2563EB">Development</text>
  </g>
  <!-- Stage Nodes -->
  <g filter="url(#shadow)">
    <rect x="586.6" y="336.3" width="180" height="76" rx="14" fill="url(#cardGrad)" stroke="#CBD5E1" stroke-width="2"/>
    <rect x="590.6" y="340.3" width="172" height="4" rx="2" fill="#2563EB"/>
    <text x="676.6" y="367.3" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#0F172A">
      <tspan x="676.6" dy="0">Analytical</tspan>
      <tspan x="676.6" dy="22">Validation</tspan>
    </text>
  </g>
  <g filter="url(#shadow)">
    <rect x="335.0" y="690.0" width="230" height="80" rx="14" fill="url(#cardGrad)" stroke="#CBD5E1" stroke-width="2"/>
    <rect x="339.0" y="694.0" width="222" height="4" rx="2" fill="#2563EB"/>
    <text x="450.0" y="723.0" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#0F172A">
      <tspan x="450.0" dy="0">Qualification:</tspan>
      <tspan x="450.0" dy="22">Evidentiary Assessment</tspan>
    </text>
  </g>
  <g filter="url(#shadow)">
    <rect x="143.4" y="341.3" width="160" height="66" rx="14" fill="url(#cardGrad)" stroke="#CBD5E1" stroke-width="2"/>
    <rect x="147.4" y="345.3" width="152" height="4" rx="2" fill="#2563EB"/>
    <text x="223.4" y="378.3" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#0F172A">
      <tspan x="223.4" dy="0">Utilization</tspan>
    </text>
  </g>
  <!-- Feedback Inner Loops -->
  <path d="M 578.09 433.84 A 18 18 0 1 1 612.73 443.13" fill="none" stroke="#475569" stroke-width="2.5" stroke-linecap="round" marker-end="url(#feedback-arrow)"/>
  <path d="M 433.09 646.16 A 18 18 0 1 1 466.91 633.84" fill="none" stroke="#475569" stroke-width="2.5" stroke-linecap="round" marker-end="url(#feedback-arrow)"/>
  <path d="M 321.91 433.84 A 18 18 0 1 1 287.27 443.13" fill="none" stroke="#475569" stroke-width="2.5" stroke-linecap="round" marker-end="url(#feedback-arrow)"/>
</svg>
